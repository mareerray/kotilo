<svg
    xmlns="http://www.w3.org/2000/svg"
    width="40"
    height="72"
    viewBox="0 0 40 72"
>
    <!-- Horizontal rails connect across repeated sections -->
    <path
        d="M0 27 H40 M0 54 H40"
        fill="none"
        stroke="#927b61"
        stroke-width="7"
    />

    <path
        d="M0 25 H40 M0 52 H40"
        fill="none"
        stroke="#c4aa86"
        stroke-width="2"
    />

    <!-- Wooden picket -->
    <path
        d="M12 71 V11 L20 3 L28 11 V71 Z"
        fill="#bca17b"
        stroke="#887459"
        stroke-width="2"
        stroke-linejoin="round"
    />

    <!-- Gentle light along the wood -->
    <path
        d="M16 65 V13 L20 9"
        fill="none"
        stroke="#dfcaab"
        stroke-width="2"
        stroke-linecap="round"
    />

    <!-- Small fastening details -->
    <g fill="#887459">
        <circle cx="20" cy="27" r="1.3"/>
        <circle cx="20" cy="54" r="1.3"/>
    </g>
</svg>